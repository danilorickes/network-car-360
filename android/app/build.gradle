plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'br.com.networkcar.diagnostico360'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.networkcar.diagnostico360"
        minSdk 24
        targetSdk 34
        versionCode 48
        versionName "0.0.48"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Assinatura ESTÁVEL para builds de homologação e debug:
    // Garante que todo APK gerado compartilhe a mesma assinatura de chave,
    // permitindo atualizações sucessivas ("instalação por cima") no dispositivo
    // sem erro de conflito de pacote (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
    signingConfigs {
        debug {
            // Caminho para o keystore fixo de homologação committed no projeto
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
