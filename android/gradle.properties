# Habilita o suporte a AndroidX para compilação e resolução de dependências
# Necessário porque o projeto utiliza bibliotecas modernas AndroidX (androidx.core:core-ktx,
# androidx.appcompat:appcompat, com.google.android.material:material, androidx.webkit:webkit).
android.useAndroidX=true

# Desativa o Jetifier explicitamente.
# Todas as dependências do projeto já são nativas AndroidX (sem bibliotecas de suporte legadas com.android.support.*).
# Desabilitar o Jetifier melhora o tempo de build e evita reescrita desnecessária de bytecode.
android.enableJetifier=false

# Otimizações de compilação Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
