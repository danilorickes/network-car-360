name: Compilar APK Android (Homologação E6.6.1)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build do APK Android de Homologação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências Frontend
        run: npm ci

      - name: Compilar Frontend React Vite (Web Build)
        run: npm run build

      - name: Copiar Bundle Web para Assets do App Android
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          echo "Assets copiados para android/app/src/main/assets/"
          ls -la android/app/src/main/assets/

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar Permissão de Execução ao Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew || true

      - name: Compilar APK Debug
        run: |
          cd android
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace || (echo "Instalando wrapper..." && gradle wrapper && ./gradlew assembleDebug)
          fi

      - name: Renomear APK de Homologação
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" network-car-teste-homologacao-e6.6.1.apk
            echo "APK preparado: network-car-teste-homologacao-e6.6.1.apk"
          else
            echo "Aviso: APK não encontrado no caminho padrão."
          fi

      - name: Publicar Artefato APK (Download Direto)
        uses: actions/upload-artifact@v4
        with:
          name: network-car-homologacao-apk
          path: |
            network-car-teste-homologacao-e6.6.1.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
