name: Compilar APK Android (Homologação E6.6.1)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build do APK Android de Homologação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configurar Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar Dependências Frontend
        run: pnpm install --frozen-lockfile

      - name: Compilar Frontend React Vite (Web Build)
        run: pnpm run build

      - name: Copiar Bundle Web para Assets do App Android
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          echo "Assets copiados para android/app/src/main/assets/:"
          ls -la android/app/src/main/assets/

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Dar Permissão de Execução ao Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew || true

      - name: Compilar APK Debug
        run: |
          cd android
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace || (echo "Instalando wrapper..." && gradle wrapper && ./gradlew assembleDebug)
          fi

      - name: Renomear APK de Homologação
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" network-car-teste-homologacao-e6.6.1.apk
            echo "APK preparado: network-car-teste-homologacao-e6.6.1.apk a partir de $APK_PATH"
          else
            echo "Erro: APK não encontrado no diretório android/app/build/outputs/apk/debug/"
            exit 1
          fi

      - name: Publicar Artefato APK (Download Direto)
        uses: actions/upload-artifact@v4
        with:
          name: network-car-homologacao-apk
          path: |
            network-car-teste-homologacao-e6.6.1.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
